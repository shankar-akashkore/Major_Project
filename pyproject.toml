[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adgen"
version = "0.1.0"
description = "Multi-candidate multimodal ad generation with learning-based performance prediction and intelligent ranking"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pillow>=10.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Intake preprocessing — added at week 3, still laptop-friendly.
# Both are optional at runtime: `adworker.intake` degrades to a flood-fill cutout
# and reports face detection as unimplemented rather than failing without them.
intake = [
    "rembg>=2.0",
    # Pinned below 5.0, which ships an empty `cv2/data/` — the bundled Haar cascade
    # XMLs were dropped, and face detection is the only thing OpenCV is here for.
    # Verified: 4.14.0 bundles 17 cascades, 5.0.0 bundles none.
    "opencv-python-headless>=4.10,<5",
]
# Feature extraction + training.  Installed in Colab, NOT on the 8 GB laptop.
ml = [
    "torch>=2.3",
    "open-clip-torch>=2.24",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["packages/schema", "packages/providers", "packages/ml", "services/api", "services/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `str, Enum` rather than `StrEnum` is deliberate: these enums are serialised
    # into JSON, stored in SQLite, and read back by the web app, and the plain
    # str-subclass behaviour is the well-trodden pydantic path.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI *requires* File()/Form()/Depends() in argument defaults — that is the
# framework's dependency-injection idiom, not the mutable-default bug B008 exists
# to catch.
"services/api/adapi/main.py" = ["B008"]
